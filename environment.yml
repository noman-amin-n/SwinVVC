# Conda environment for SwinVVC.
#
#   conda env create -f environment.yml
#   conda activate swinvvc
#
# This installs the CPU/CUDA build of PyTorch that pip resolves for your
# platform. For a specific CUDA version, install torch separately following
# https://pytorch.org/get-started/locally/ and then `pip install -r requirements.txt`.

name: swinvvc

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip>=23.0

  # numerics and image I/O
  - numpy>=1.24
  - pillow>=10.0
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - pyyaml>=6.0

  # tests
  - pytest>=7.4

  # notebooks (optional; needed only for notebooks/)
  - jupyterlab
  - ipykernel

  - pip:
      - opencv-python>=4.8
      - torch>=2.0
      - torchvision>=0.15
      - timm>=0.9
